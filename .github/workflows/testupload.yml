name: test artifact upload
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        shell: bash
        run: make

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: ./main1.pdf
